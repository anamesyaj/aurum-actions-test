name: Public Android Toolchain Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-android-toolchain-smoke.yml

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Create throwaway Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/app/src/main/java/test/publicci
          cat > smoke/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PublicAndroidSmoke"
          include(":app")
          EOF
          cat > smoke/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
          }
          EOF
          cat > smoke/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "test.publicci"
              compileSdk = 36
              defaultConfig {
                  applicationId = "test.publicci"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          cat > smoke/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Public CI Smoke" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > smoke/app/src/main/java/test/publicci/MainActivity.java <<'EOF'
          package test.publicci;
          import android.app.Activity;
          public final class MainActivity extends Activity {}
          EOF

      - name: Build throwaway debug APK
        run: gradle -p smoke --no-daemon --no-parallel --max-workers=2 clean assembleDebug

      - name: Prove APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK=smoke/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          stat -c 'bytes=%s' "$APK"
          sha256sum "$APK"
          echo "PUBLIC_ANDROID_TOOLCHAIN_OK"
